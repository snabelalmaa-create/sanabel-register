
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل عملاء سنابل المع</title>
<style>
body{font-family:Cairo,Tahoma,sans-serif;background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:#fff;width:100%;max-width:420px;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.logo{text-align:center;font-size:30px;font-weight:900;margin-bottom:8px;color:#1e3a8a}
.sub{text-align:center;color:#555;margin-bottom:20px;line-height:1.8}
input{width:100%;padding:14px;margin-bottom:14px;border-radius:14px;border:1px solid #d1d5db;font-size:16px;font-weight:700;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:14px;background:#2563eb;color:#fff;font-size:18px;font-weight:900;cursor:pointer}
.msg{margin-top:14px;text-align:center;font-weight:800}
.success{color:#16a34a}
.error{color:#dc2626}
</style>
</head>
<body>
<div class="card">
<div class="logo">🛒 سنابل المع</div>
<div class="sub">سجل بياناتك للحصول على العروض والتنبيهات</div>

<input type="text" id="firstName" placeholder="الاسم الأول">
<input type="text" id="lastName" placeholder="الاسم الثاني">
<input type="tel" id="phone" placeholder="05XXXXXXXX">

<button onclick="saveCustomer()">إرسال البيانات</button>

<div id="msg" class="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAvnzrViT0cXL2crqqFcSGynEF6ZXwbaFI",
authDomain: "alshreme-system.firebaseapp.com",
projectId: "alshreme-system"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveCustomer = async function(){
const firstName = document.getElementById("firstName").value.trim();
const lastName = document.getElementById("lastName").value.trim();
const phone = document.getElementById("phone").value.trim();
const msg = document.getElementById("msg");

msg.className = "msg";
msg.textContent = "";

if(!firstName || !lastName || !phone){
msg.classList.add("error");
msg.textContent = "أكمل جميع البيانات";
return;
}

if(!/^05\d{8}$/.test(phone)){
msg.classList.add("error");
msg.textContent = "رقم الجوال غير صحيح";
return;
}

try{
const q = query(collection(db,"customers_qr"), where("phone","==",phone));
const snap = await getDocs(q);

if(!snap.empty){
msg.classList.add("error");
msg.textContent = "الرقم مسجل مسبقًا";
return;
}

await addDoc(collection(db,"customers_qr"),{
firstName,lastName,phone,createdAt:new Date()
});

msg.classList.add("success");
msg.textContent = "تم التسجيل بنجاح ✅";

document.getElementById("firstName").value = "";
document.getElementById("lastName").value = "";
document.getElementById("phone").value = "";

}catch(e){
msg.classList.add("error");
msg.textContent = "حدث خطأ أثناء الحفظ";
}
}
</script>
</body>
</html>
